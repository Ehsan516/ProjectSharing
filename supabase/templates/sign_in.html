<!--
  Optional: paste into BOTH Supabase email templates (Authentication -> Emails -> Templates):
    - "Magic link or OTP"   (existing users signing in)
    - "Confirm sign up"     (new accounts)
  Subject suggestion: Your Forkyard sign-in code

  The app works with Supabase's default emails too (link only). This template adds:
    - a link that works on any device, not just the browser that asked for it (token_hash)
    - a 6-digit code ({{ .Token }}) that can be typed on the sign-in page
  {{ .SiteURL }} comes from Authentication -> URL Configuration -> Site URL, so set that to your real domain.
-->
<h2 style="font-family:Arial,sans-serif;color:#191917">Sign in to Forkyard</h2>
<p style="font-family:Arial,sans-serif;color:#191917">Tap the button to sign in:</p>
<p>
  <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email"
     style="display:inline-block;padding:10px 18px;background:#c4b5ff;color:#191917;border:1px solid #191917;border-radius:6px;text-decoration:none;font-family:Arial,sans-serif;font-weight:600">
    Sign in
  </a>
</p>
<p style="font-family:Arial,sans-serif;color:#191917">Or enter this code on the sign-in page:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px;font-family:monospace;color:#191917">{{ .Token }}</p>
<p style="font-family:Arial,sans-serif;color:#6b6a64;font-size:12px">If you didn't request this, you can ignore this email.</p>
