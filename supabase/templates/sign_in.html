<!--
  Paste this into BOTH of these Supabase email templates
  (Dashboard -> Authentication -> Emails -> Templates):
    - "Confirm signup"
    - "Magic link"
  The link works in any browser/device; the code can be typed on the sign-in page.
-->
<h2>Sign in to Forkyard</h2>
<p>Click the button to sign in:</p>
<p>
  <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email"
     style="display:inline-block;padding:10px 18px;background:#e8590c;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:600">
    Sign in
  </a>
</p>
<p>Or enter this code on the sign-in page:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px;font-family:monospace">{{ .Token }}</p>
<p style="color:#888;font-size:12px">If you didn't request this, you can ignore this email.</p>
